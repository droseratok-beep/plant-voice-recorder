<body>
<header>🌿 重要種・植物記録</header>
<main>
<section class="card">
  <h2>調査地域</h2>
  <select id="region" style="width:100%;font-size:22px;padding:16px;border:2px solid #ccd7cf;border-radius:18px">
    <option value="徳島県">徳島県</option>
    <option value="滋賀県">滋賀県</option>
    <option value="兵庫県">兵庫県</option>
    <option value="京都府">京都府</option>
  </select>
  <p class="small">選択した県と環境省の両方を基準に重要種を判定します。</p>
</section>

<section class="card">
  <button class="primary" id="speak">🎙️ 植物名を話す</button>
  <p id="status">植物名を話してください。</p>
  <input id="plantName" placeholder="植物名（必要なら修正）">
</section>

<section class="card" id="speciesInfo" style="display:none">
  <div id="importantBadge" class="notice"></div>
  <div id="extraFields" style="display:none">
    <h3>重要種の追加情報</h3>
    <label>個体数</label>
    <input id="countInput" inputmode="numeric" type="number" min="1" placeholder="例：3">
    <button id="countSpeak" style="margin-top:10px">🎙️ 個体数を話す</button>
    <label style="display:block;margin-top:16px">生育環境</label>
    <input id="habitatInput" placeholder="例：林床、湿地、河原">
    <button id="habitatSpeak" style="margin-top:10px">🎙️ 生育環境を話す</button>
  </div>
</section>

<section class="card">
  <button id="save" class="primary">💾 保存</button>
  <button id="csv" style="width:100%;margin-top:12px">CSV保存（途中でもOK）</button>
  <p class="small">日付が変わると本日の記録は0種から始まります。変換データと過去の記録は保持します。</p>
</section>

<section class="card">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">本日の記録</h2>
    <div class="count" id="count">0種</div>
  </div>
  <div id="records"></div>
</section>
</main>

function hiraToKata(s){return s.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60))}
function normalize(s){
  s=(s||"").trim().replace(/[「」『』［］【】、。,.，．\s]/g,"");
  if(!s)return "";
  let aliases={};try{aliases=JSON.parse(localStorage.getItem(ALIAS_KEY)||"{}")}catch(e){}
  return aliases[s] || legacyAliasMap[s] || hiraToKata(s);
}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}
function saveAll(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function dateKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return load().filter(r=>r.dateKey===dateKey())}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function lookup(name){
  if(suppliedDatabase[name]) return suppliedDatabase[name];
  // Try a simple exact katakana-normalized lookup.
  const n=normalize(name);
  for(const k of Object.keys(suppliedDatabase)){
    if(normalize(k)===n)return suppliedDatabase[k];
  }
  return null;
}
function importantInfo(name){
  const r=lookup(name);
  if(!r)return null;
  const region=document.getElementById("region").value;
  const env=(r["環境省"]||"").trim();
  const pref=(r[region]||"").trim();
  return {env,pref,important:!!(env||pref)};
}
function updateSpeciesUI(){
  const name=normalize(document.getElementById("plantName").value);
  const box=document.getElementById("speciesInfo"),extra=document.getElementById("extraFields");
  if(!name){box.style.display="none";return}
  const info=importantInfo(name);
  box.style.display="block";
  if(info && info.important){
    const parts=[];
    if(info.env)parts.push("環境省："+info.env);
    if(info.pref)parts.push(document.getElementById("region").value+"："+info.pref);
    document.getElementById("importantBadge").innerHTML="⚠️ <strong>重要種</strong>（"+parts.join(" / ")+"）";
    extra.style.display="block";
  }else{
    document.getElementById("importantBadge").textContent=info ? "一般種：選択地域・環境省の重要種指定なし" : "一覧に判定情報がありません。個体数・生育環境の入力は不要です。";
    extra.style.display="none";
    document.getElementById("countInput").value="";
    document.getElementById("habitatInput").value="";
  }
}
function render(){
  const a=today();document.getElementById("count").textContent=a.length+"種";
  const box=document.getElementById("records");
  box.innerHTML=a.length?a.map(r=>`<div class="record"><div class="name">${escapeHtml(r.name)} ${r.important?"⚠️":""}</div>
  <div class="small">${escapeHtml(r.date)}${r.important?`　個体数:${escapeHtml(r.count)}　生育環境:${escapeHtml(r.habitat)}`:""}</div></div>`).join(""):'<p class="small">本日の記録はありません。</p>';
}
function listen(onText){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("このブラウザでは音声認識が利用できません。入力欄をご利用ください。");return}
  const r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=3;
  r.onresult=e=>onText(Array.from(e.results[0]).map(x=>x.transcript));
  r.onerror=()=>document.getElementById("status").textContent="音声を認識できませんでした。";
  r.start();
}
document.getElementById("speak").onclick=()=>{
  document.getElementById("status").textContent="聞き取り中です……";
  listen(alts=>{
    let chosen=normalize(alts[0]||"");
    for(const a of alts){const n=normalize(a);if(lookup(n)){chosen=n;break}}
    document.getElementById("plantName").value=chosen;
    document.getElementById("status").textContent="植物名を認識しました。";
    updateSpeciesUI();
  });
};
document.getElementById("region").onchange=updateSpeciesUI;
document.getElementById("plantName").oninput=updateSpeciesUI;
document.getElementById("plantName").onblur=e=>{e.target.value=normalize(e.target.value);updateSpeciesUI()};
document.getElementById("countSpeak").onclick=()=>listen(alts=>{
  const raw=alts[0]||"";const m=raw.match(/\d+/);document.getElementById("countInput").value=m?m[0]:raw.replace(/[^\d]/g,"");
});
document.getElementById("habitatSpeak").onclick=()=>listen(alts=>document.getElementById("habitatInput").value=normalize(alts[0]||""));
document.getElementById("save").onclick=()=>{
  const name=normalize(document.getElementById("plantName").value);if(!name){alert("植物名を入力してください。");return}
  const info=importantInfo(name),imp=!!(info&&info.important);
  const rec={name,date:new Date().toLocaleString("ja-JP"),dateKey:dateKey(),important:imp,region:document.getElementById("region").value,envStatus:info?info.env:"",prefStatus:info?info.pref:""};
  if(imp){
    const c=document.getElementById("countInput").value.trim(),h=document.getElementById("habitatInput").value.trim();
    if(!c||!h){alert("重要種なので、個体数と生育環境を入力してください。");return}
    rec.count=c;rec.habitat=h;
  }
  const a=load();a.push(rec);saveAll(a);
  document.getElementById("plantName").value="";document.getElementById("countInput").value="";document.getElementById("habitatInput").value="";
  document.getElementById("speciesInfo").style.display="none";document.getElementById("status").textContent="保存しました。";render();
};
function csvText(){
  const rows=[["No","植物名","重要種","環境省区分","県区分","調査県","個体数","生育環境","日時"]];
  today().forEach((r,i)=>rows.push([i+1,r.name,r.important?"重要種":"",r.envStatus||"",r.prefStatus||"",r.region||"",r.count||"",r.habitat||"",r.date]));
  return "\uFEFF"+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
}
document.getElementById("csv").onclick=async()=>{
  const a=today();if(!a.length){alert("本日の記録がありません。");return}
  const blob=new Blob([csvText()],{type:"text/csv;charset=utf-8"}),file=new File([blob],"重要種植物記録_"+dateKey()+".csv",{type:"text/csv"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:"重要種植物記録",files:[file]});return}catch(e){}}
  const u=URL.createObjectURL(blob),aTag=document.createElement("a");aTag.href=u;aTag.download=file.name;document.body.appendChild(aTag);aTag.click();aTag.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
render();setInterval(render,60000);
</script></body></html>
