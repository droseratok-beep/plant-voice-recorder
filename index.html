<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>植物記録</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f7f3;color:#183a25;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:#2d7d32;color:white;padding:22px 20px;font-size:28px;font-weight:700}
main{padding:20px 14px 50px;max-width:760px;margin:auto}
.card{background:white;border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #00000010}
button{border:0;border-radius:18px;padding:18px 22px;font-size:20px;font-weight:700;background:#e5efe7;color:#183a25}
.primary{width:100%;background:#2d7d32;color:white;font-size:27px;padding:28px 18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
input{width:100%;font-size:25px;padding:18px;border:2px solid #ccd7cf;border-radius:18px}
.small{font-size:15px;color:#65756b}
.count{font-size:18px;font-weight:700}
.record{padding:16px 0;border-bottom:1px solid #dfe7e1}
.record:last-child{border-bottom:0}
.name{font-size:25px;font-weight:700}
.actions button{font-size:16px;padding:12px 16px}
.danger{background:#fde7e5;color:#9d3028}
.notice{background:#eef7ef;border-radius:16px;padding:14px;margin-top:12px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="植物記録">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<header>🌿 植物記録</header>
<main>

<section class="card">
<button class="primary" id="speak">🎙️ 植物名を話す</button>
<p id="status">マイクを押して植物名を話してください。</p>
<p class="small">音声認識後、植物名をカタカナに正規化して記録します。必要なら下の欄で修正できます。</p>
</section>

<section class="card">
<h2>植物名（必要なら修正できます）</h2>
<input id="plantName" placeholder="植物名">
<div class="row" style="margin-top:14px">
<button id="save">保存</button>
<button id="csv">CSV保存（途中でもOK）</button>
</div>
<div class="notice">
<strong>途中保存：</strong> 保存した記録はこのiPhoneのブラウザ内にも自動保存されます。
</div>
</section>

<section class="card">
<div class="row" style="justify-content:space-between;align-items:center">
<h2 style="margin:0">記録一覧</h2>
<div class="count" id="count">0種</div>
</div>
<p class="small">記録は日付ごとに管理します。日付が変わると本日の件数は0種から始まり、過去の記録と漢字→カタカナ変換は保持されます。</p>
<div id="records"></div>
</section>

<section class="card">
<h2>データ管理</h2>
<div class="row">
<button id="clear" class="danger">全記録を削除</button>
</div>
<p class="small">このボタンを押すと、このブラウザに保存された記録だけを削除します。</p>
</section>

</main>

<script>
const STORAGE_KEY="plant_voice_records_v1";
const ALIAS_KEY="plant_aliases_v1";

/* 既知の漢字表記・誤認識などをここに追加できます */
const kanjiAliasMap={
  "鬼芝":"オニシバ",
  "長身鬼芝":"ナガミノオニシバ",
  "長身ノ小柴":"ナガミノオニシバ",
  "西洋タンポポ":"セイヨウタンポポ",
  "西洋たんぽぽ":"セイヨウタンポポ",
  "西洋たんぽぽ":"セイヨウタンポポ"
};

function hiraToKata(s){
  return s.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}
function normalize(s){
  s=(s||"").trim().replace(/[「」『』［］\[\]（）()]/g,"").replace(/\s+/g,"");
  if(!s) return "";
  let aliases={};
  try{aliases=JSON.parse(localStorage.getItem(ALIAS_KEY)||"{}")}catch(e){}
  if(aliases[s]) return aliases[s];
  if(kanjiAliasMap[s]) return kanjiAliasMap[s];
  return hiraToKata(s);
}
function load(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return []}
}
function saveAll(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function localDateKey(date=new Date()){
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function currentDayRecords(){
  const today=localDateKey();
  return load().filter(r=>r.dateKey===today);
}
function render(){
  const all=load();
  const a=all.filter(r=>r.dateKey===localDateKey());
  document.getElementById("count").textContent=a.length+"種";
  const box=document.getElementById("records");
  if(!a.length){box.innerHTML='<p style="color:#65756b;text-align:center">まだ記録がありません。</p>';return}
  box.innerHTML=a.map((r,i)=>{
    const batch=Math.floor(i/100)+1;
    return `<div class="record">
      <div class="name">${escapeHtml(r.name)}</div>
      <div class="small">${r.date}　｜　第${batch}グループ・${(i%100)+1}/100</div>
      <div class="actions" style="margin-top:10px">
        <button onclick="editRecord(${i})">編集</button>
        <button class="danger" onclick="deleteRecord(${i})">削除</button>
      </div>
    </div>`;
  }).join("");
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function add(){
  const raw=document.getElementById("plantName").value;
  const name=normalize(raw);
  if(!name){alert("植物名を入力してください。");return}
  const a=load();
  a.push({name,date:new Date().toLocaleString("ja-JP"),dateKey:localDateKey()});
  saveAll(a);
  document.getElementById("plantName").value="";
  document.getElementById("status").textContent="保存しました： "+name;
  render();
}
function editRecord(i){
  const a=load();
  const v=prompt("植物名を修正してください",a[i].name);
  if(v===null)return;
  const n=normalize(v);
  if(!n)return;
  a[i].name=n;
  saveAll(a);render();
}
function deleteRecord(i){
  if(!confirm("この記録を削除しますか？"))return;
  const a=load();a.splice(i,1);saveAll(a);render();
}
function csvText(){
  const a=currentDayRecords();
  const rows=[["No","植物名","日時"]];
  a.forEach((r,i)=>rows.push([i+1,r.name,r.date]));
  return "\uFEFF"+rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
}
async function exportCSV(){
  const a=load();
  if(!a.length){alert("保存する記録がありません。");return}
  const blob=new Blob([csvText()],{type:"text/csv;charset=utf-8"});
  const file=new File([blob],"植物記録_"+localDateKey()+".csv",{type:"text/csv"});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({title:"植物記録CSV",files:[file]});return}catch(e){}
  }
  const url=URL.createObjectURL(blob);
  const aTag=document.createElement("a");
  aTag.href=url;aTag.download=file.name;
  document.body.appendChild(aTag);aTag.click();aTag.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById("save").onclick=add;
document.getElementById("csv").onclick=exportCSV;
document.getElementById("clear").onclick=()=>{
  if(confirm("すべての植物記録を削除します。よろしいですか？")){
    localStorage.removeItem(STORAGE_KEY);render();
  }
};
document.getElementById("speak").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("このブラウザでは音声認識が利用できません。植物名を下の欄に入力してください。");return}
  const r=new SR();
  r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=1;
  document.getElementById("status").textContent="聞き取り中です……";
  r.onresult=e=>{
    const raw=e.results[0][0].transcript;
    const n=normalize(raw);
    document.getElementById("plantName").value=n;
    document.getElementById("status").textContent="認識しました。必要なら修正して「保存」を押してください。";
  };
  r.onerror=()=>document.getElementById("status").textContent="音声を認識できませんでした。植物名を入力してください。";
  r.start();
};
document.getElementById("plantName").addEventListener("blur",e=>{
  if(e.target.value)e.target.value=normalize(e.target.value);
});
render();
setInterval(render,60000);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
