<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e7d32"><title>🌿 植物記録</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f8f4;color:#17351f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{background:#2e7d32;color:white;padding:28px 34px;font-size:30px;font-weight:700}main{max-width:900px;margin:auto;padding:34px}.card{background:white;border-radius:28px;padding:34px;margin-bottom:28px;box-shadow:0 5px 18px #00000012}button{border:0;border-radius:22px;padding:20px 30px;font-size:25px;font-weight:700;color:#17351f;background:#e8f0ea;margin:8px 10px 8px 0}button.primary{display:block;width:100%;background:#2e7d32;color:white;font-size:32px;padding:28px}button.delete{background:#fde8e6;color:#a52a24}input{width:100%;font-size:28px;padding:22px;border:2px solid #ccd5ce;border-radius:18px;margin:10px 0 16px}.status{font-size:21px;line-height:1.55;color:#66736a;margin-top:12px}.message{font-size:24px;line-height:1.5;margin:8px 0}.record{border-top:1px solid #e0e6e1;padding:20px 0}.name{font-size:28px;font-weight:700}.meta{font-size:19px;line-height:1.55;margin:5px 0 12px;color:#536158}.small{font-size:17px;color:#6a756e}h2{margin-top:0}@media(max-width:600px){header{font-size:27px;padding:24px 30px}main{padding:24px 20px}.card{padding:24px;border-radius:25px}button.primary{font-size:27px}input{font-size:25px}}</style></head>
<body><header>🌿 植物記録</header><main>
<section class="card"><button class="primary" id="speakBtn">🎤 植物名を話す</button><div class="message" id="message">マイクを押して植物名を話してください。</div><div class="status" id="locationStatus">位置情報：取得中…</div></section>
<section class="card"><h2>植物名（必要なら修正できます）</h2><input id="plantName" type="text" placeholder="植物名"><button id="saveBtn">保存</button><button id="csvBtn">Excel用CSV</button><div class="small">※保存時に、ひらがな・登録済みの漢字植物名をカタカナへ統一します。未登録の漢字は手動修正できます。</div></section>
<section class="card"><h2>記録一覧</h2><div id="records"></div></section></main>
<script>
const STORAGE_KEY="plant_voice_records_v1";let currentLocation=null,editingId=null;
const plantMap={
"西洋タンポポ":"セイヨウタンポポ","西洋たんぽぽ":"セイヨウタンポポ","西洋蒲公英":"セイヨウタンポポ","セイヨウタンポポ":"セイヨウタンポポ","タンポポ":"タンポポ","たんぽぽ":"タンポポ","蒲公英":"タンポポ","桜":"サクラ","さくら":"サクラ","サクラ":"サクラ","山桜":"ヤマザクラ","やまざくら":"ヤマザクラ","ヤマザクラ":"ヤマザクラ","染井吉野":"ソメイヨシノ","そめいよしの":"ソメイヨシノ","ソメイヨシノ":"ソメイヨシノ","紫陽花":"アジサイ","あじさい":"アジサイ","アジサイ":"アジサイ","向日葵":"ヒマワリ","ひまわり":"ヒマワリ","ヒマワリ":"ヒマワリ","菫":"スミレ","すみれ":"スミレ","スミレ":"スミレ","躑躅":"ツツジ","つつじ":"ツツジ","ツツジ":"ツツジ","紅葉":"モミジ","もみじ":"モミジ","モミジ":"モミジ","白詰草":"シロツメクサ","白詰め草":"シロツメクサ","しろつめぐさ":"シロツメクサ","しろつめくさ":"シロツメクサ","シロツメクサ":"シロツメクサ","四葉のクローバー":"ヨツバノクローバー","四つ葉のクローバー":"ヨツバノクローバー","よつばのくろーばー":"ヨツバノクローバー","クローバー":"クローバー","くろーばー":"クローバー","蓮":"ハス","はす":"ハス","ハス":"ハス","睡蓮":"スイレン","すいれん":"スイレン","スイレン":"スイレン","彼岸花":"ヒガンバナ","ひがんばな":"ヒガンバナ","ヒガンバナ":"ヒガンバナ","曼珠沙華":"マンジュシャゲ","まんじゅしゃげ":"マンジュシャゲ","マンジュシャゲ":"マンジュシャゲ","菜の花":"ナノハナ","なのはな":"ナノハナ","ナノハナ":"ナノハナ","蒲":"ガマ","がま":"ガマ","ガマ":"ガマ","芒":"ススキ","薄":"ススキ","すすき":"ススキ","ススキ":"ススキ","松":"マツ","まつ":"マツ","マツ":"マツ","杉":"スギ","すぎ":"スギ","スギ":"スギ","檜":"ヒノキ","桧":"ヒノキ","ひのき":"ヒノキ","ヒノキ":"ヒノキ","竹":"タケ","たけ":"タケ","タケ":"タケ","梅":"ウメ","うめ":"ウメ","ウメ":"ウメ","藤":"フジ","ふじ":"フジ","フジ":"フジ","椿":"ツバキ","つばき":"ツバキ","ツバキ":"ツバキ","百合":"ユリ","ゆり":"ユリ","ユリ":"ユリ","薔薇":"バラ","ばら":"バラ","バラ":"バラ","朝顔":"アサガオ","あさがお":"アサガオ","アサガオ":"アサガオ","紫蘇":"シソ","しそ":"シソ","シソ":"シソ","蕗":"フキ","ふき":"フキ","フキ":"フキ","土筆":"ツクシ","つくし":"ツクシ","ツクシ":"ツクシ","蓬":"ヨモギ","よもぎ":"ヨモギ","ヨモギ":"ヨモギ","葛":"クズ","くず":"クズ","クズ":"クズ","桔梗":"キキョウ","ききょう":"キキョウ","キキョウ":"キキョウ","萩":"ハギ","はぎ":"ハギ","ハギ":"ハギ","藤袴":"フジバカマ","ふじばかま":"フジバカマ","フジバカマ":"フジバカマ"};
function hiraToKata(s){return s.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60))}
function normalizePlantName(input){let s=(input||"").trim().replace(/[「」『』［］【】、。,.，．]/g,"").replace(/\s+/g,"");if(!s)return"";if(plantMap[s])return plantMap[s];const keys=Object.keys(plantMap).sort((a,b)=>b.length-a.length);for(const k of keys)if(s.includes(k)&&k.length>=2)return s.replaceAll(k,plantMap[k]);if(!/[一-龯々〆ヵヶ]/.test(s))return hiraToKata(s);return s}
function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}function setRecords(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a));renderRecords()}function nowISO(){return new Date().toISOString()}
function getLocation(){const el=document.getElementById("locationStatus");if(!navigator.geolocation){el.textContent="位置情報：このブラウザでは利用できません";return}el.textContent="位置情報：取得中…";navigator.geolocation.getCurrentPosition(pos=>{currentLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,horizontalAccuracy:pos.coords.accuracy};el.textContent=`位置情報：${currentLocation.latitude.toFixed(6)}, ${currentLocation.longitude.toFixed(6)}（±${Math.round(currentLocation.horizontalAccuracy)}m）`},()=>{currentLocation=null;el.textContent="位置情報：取得できませんでした（植物名と日時は保存できます）"},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById("message").textContent="このSafariでは音声認識を利用できません。";return}const r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=5;document.getElementById("message").textContent="聞き取っています…";r.onresult=e=>{const raw=e.results[0][0].transcript;document.getElementById("plantName").value=normalizePlantName(raw);document.getElementById("message").textContent=`「${raw}」を認識しました。必要なら修正して「保存」を押してください。`;getLocation()};r.onerror=()=>{document.getElementById("message").textContent="音声認識でエラーが発生しました。もう一度お試しください。"};r.start()}
function save(){const input=document.getElementById("plantName"),name=normalizePlantName(input.value);if(!name){alert("植物名を入力してください。");return}input.value=name;const arr=getRecords();if(editingId){const i=arr.findIndex(x=>x.id===editingId);if(i>=0){arr[i].plantName=name;if(currentLocation)Object.assign(arr[i],currentLocation)}editingId=null}else arr.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),plantName:name,recordedAt:nowISO(),latitude:currentLocation?.latitude??null,longitude:currentLocation?.longitude??null,horizontalAccuracy:currentLocation?.horizontalAccuracy??null});setRecords(arr);input.value="";document.getElementById("message").textContent="保存しました。";getLocation()}
function editRecord(id){const x=getRecords().find(r=>r.id===id);if(!x)return;editingId=id;document.getElementById("plantName").value=x.plantName;document.getElementById("message").textContent="修正内容を入力して「保存」を押してください。";window.scrollTo({top:0,behavior:"smooth"})}
function deleteRecord(id){if(confirm("この記録を削除しますか？"))setRecords(getRecords().filter(x=>x.id!==id))}
function fmtDate(s){const d=new Date(s);return d.toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function renderRecords(){const el=document.getElementById("records"),arr=getRecords();if(!arr.length){el.innerHTML='<div class="status">まだ記録がありません。</div>';return}el.innerHTML=arr.map(x=>{const loc=x.latitude!=null?`📍 ${Number(x.latitude).toFixed(6)}, ${Number(x.longitude).toFixed(6)}（±${Math.round(x.horizontalAccuracy||0)}m）`:"📍 位置情報なし";return `<div class="record"><div class="name">${escapeHtml(x.plantName)}</div><div class="meta">${fmtDate(x.recordedAt)}<br>${loc}</div><button onclick="editRecord('${x.id}')">編集</button><button class="delete" onclick="deleteRecord('${x.id}')">削除</button></div>`}).join("")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#39;"}[m]))}
function exportCSV(){const rows=getRecords().map((x,i)=>[i+1,new Date(x.recordedAt).toLocaleDateString("ja-JP"),new Date(x.recordedAt).toLocaleTimeString("ja-JP"),x.plantName,x.latitude??"",x.longitude??"",x.horizontalAccuracy??""]);const csv="\uFEFF"+[["No.","Date","Time","Plant name","Latitude","Longitude","GPS accuracy"],...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="植物記録_"+new Date().toISOString().slice(0,10)+".csv";a.click();URL.revokeObjectURL(a.href)}
document.getElementById("speakBtn").onclick=recognize;document.getElementById("saveBtn").onclick=save;document.getElementById("csvBtn").onclick=exportCSV;renderRecords();getLocation();
</script></body></html>
