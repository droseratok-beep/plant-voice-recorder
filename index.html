<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.webmanifest">
<title>植物記録</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f7f5;color:#18301d}
header{background:#2e7d32;color:white;padding:18px 16px calc(18px + env(safe-area-inset-top));font-size:22px;font-weight:700}
main{padding:16px;max-width:720px;margin:auto}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
button{border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600}
#recordBtn{width:100%;background:#2e7d32;color:white;font-size:21px;padding:20px}
#recordBtn.recording{background:#b3261e}
input{width:100%;padding:13px;border:1px solid #ccd5cc;border-radius:10px;font-size:18px;margin:8px 0}
.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:13px;color:#5d6b60}.status{margin-top:10px;line-height:1.5}
.item{border-top:1px solid #e2e7e2;padding:12px 0}.item:first-child{border-top:0}.name{font-size:19px;font-weight:700}
.actions{display:flex;gap:8px;margin-top:12px}.secondary{background:#e8eee8;color:#18301d}.danger{background:#fde8e7;color:#8a1c17}
#records{max-height:45vh;overflow:auto}.empty{color:#68756a;text-align:center;padding:20px}
</style>
</head>
<body>
<header>🌿 植物記録</header>
<main>
<section class="card">
<button id="recordBtn">🎤 植物名を話す</button>
<div id="status" class="status">マイクをタップして植物名を話してください。</div>
<div id="location" class="small">位置情報：未取得</div>
</section>

<section class="card">
<label>植物名（必要なら修正できます）</label>
<input id="plantName" placeholder="例：サクラ">
<div class="actions">
<button id="saveBtn" class="secondary">保存</button>
<button id="exportBtn" class="secondary">Excel用CSV</button>
</div>
</section>

<section class="card">
<strong>記録一覧</strong>
<div id="records"></div>
</section>
</main>

<script>
const KEY="plant_voice_records_v1";
let records=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentLocation=null;
let recognition=null;
let listening=false;

const $=id=>document.getElementById(id);
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(records));render();}
function toKatakana(s){
  return s.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60)).trim();
}
function normalize(s){
  s=toKatakana(s).replace(/[、。！？,.!?]/g,"").trim();
  const dict={
    "さくら":"サクラ","ソメイヨシノ":"ソメイヨシノ","そめいよしの":"ソメイヨシノ",
    "しろつめぐさ":"シロツメクサ","しろつめくさ":"シロツメクサ",
    "たんぽぽ":"タンポポ","すみれ":"スミレ","つつじ":"ツツジ",
    "あじさい":"アジサイ","ひまわり":"ヒマワリ","もみじ":"モミジ"
  };
  return dict[s.toLowerCase()]||s;
}
function getLocation(){
  if(!navigator.geolocation){$("location").textContent="位置情報：この環境では利用できません";return;}
  $("location").textContent="位置情報：取得中…";
  navigator.geolocation.getCurrentPosition(p=>{
    currentLocation={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
    $("location").textContent=`位置情報：${currentLocation.lat.toFixed(6)}, ${currentLocation.lon.toFixed(6)}（±${Math.round(currentLocation.acc)}m）`;
  },e=>{
    currentLocation=null;
    $("location").textContent="位置情報：取得できませんでした（植物名と日時は保存できます）";
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("status").textContent="このブラウザでは音声認識が利用できません。植物名を直接入力してください。";return null;}
  const r=new SR(); r.lang="ja-JP"; r.interimResults=false;r.maxAlternatives=3;
  r.onstart=()=>{listening=true;$("recordBtn").classList.add("recording");$("recordBtn").textContent="⏹ 聞き取り中…";$("status").textContent="植物名を話してください。"};
  r.onresult=e=>{let s=e.results[0][0].transcript;$("plantName").value=normalize(s);$("status").textContent="認識しました。必要なら名前を修正して「保存」を押してください。"};
  r.onerror=e=>{$("status").textContent="音声認識エラー："+e.error};
  r.onend=()=>{listening=false;$("recordBtn").classList.remove("recording");$("recordBtn").textContent="🎤 植物名を話す"};
  return r;
}
recognition=setupRecognition();
$("recordBtn").onclick=()=>{if(!recognition)return;if(listening)recognition.stop();else{getLocation();try{recognition.start()}catch(e){}}};
$("saveBtn").onclick=()=>{
  const name=normalize($("plantName").value);
  if(!name){alert("植物名を入力してください");return;}
  if(!currentLocation)getLocation();
  records.unshift({id:crypto.randomUUID(),plantName:name,recordedAt:new Date().toISOString(),latitude:currentLocation?.lat??null,longitude:currentLocation?.lon??null,accuracy:currentLocation?.acc??null});
  saveLocal();$("plantName").value="";$("status").textContent="保存しました。";
};
$("exportBtn").onclick=()=>{
  if(!records.length){alert("記録がありません");return;}
  const esc=v=>`"${String(v??"").replaceAll('"','""')}"`;
  const rows=[["No.","Date","Time","Plant name","Latitude","Longitude","GPS accuracy"]];
  records.forEach((r,i)=>{const d=new Date(r.recordedAt);rows.push([i+1,d.toLocaleDateString("ja-JP"),d.toLocaleTimeString("ja-JP"),r.plantName,r.latitude,r.longitude,r.accuracy]);});
  const csv="\uFEFF"+rows.map(x=>x.map(esc).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="植物記録.csv";a.click();URL.revokeObjectURL(a.href);
};
function render(){
  if(!records.length){$("records").innerHTML='<div class="empty">まだ記録がありません。</div>';return;}
  $("records").innerHTML=records.map(r=>{
    const d=new Date(r.recordedAt);
    const loc=r.latitude==null?"位置情報なし":`${r.latitude.toFixed(6)}, ${r.longitude.toFixed(6)}（±${Math.round(r.accuracy||0)}m）`;
    return `<div class="item"><div class="name">${escapeHtml(r.plantName)}</div><div>${d.toLocaleString("ja-JP")}</div><div class="small">📍 ${loc}</div><div class="actions"><button class="secondary" onclick="editRec('${r.id}')">編集</button><button class="danger" onclick="deleteRec('${r.id}')">削除</button></div></div>`;
  }).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
window.editRec=id=>{const r=records.find(x=>x.id===id);const n=prompt("植物名",r.plantName);if(n!==null&&n.trim()){r.plantName=normalize(n);saveLocal();}};
window.deleteRec=id=>{if(confirm("この記録を削除しますか？")){records=records.filter(x=>x.id!==id);saveLocal();}};
render(); getLocation();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
