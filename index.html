function hiraToKata(s){return s.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60))}
function normalizePlantName(input){
 let s=(input||"").trim().replace(/[「」『』［］【】、。,.，．]/g,"").replace(/\s+/g,"");
 if(!s)return"";
 const aliases=JSON.parse(localStorage.getItem("plant_aliases_v1")||"{}");
 if(aliases[s])return aliases[s];
 if(kanjiAliasMap[s]&&plantSet.has(kanjiAliasMap[s]))return kanjiAliasMap[s];
 if(plantMap[s])return plantMap[s];
 const hira=hiraToKata(s);
 if(plantSet.has(hira))return hira;
 if(plantSet.has(s))return s;
 const aliasKeys=Object.keys(kanjiAliasMap).sort((a,b)=>b.length-a.length);
 for(const k of aliasKeys)if(s.includes(k)&&k.length>=2&&plantSet.has(kanjiAliasMap[k]))return s.replaceAll(k,kanjiAliasMap[k]);
 const keys=Object.keys(plantMap).sort((a,b)=>b.length-a.length);
 for(const k of keys)if(s.includes(k)&&k.length>=2)return s.replaceAll(k,plantMap[k]);
 if(!/[一-龯々〆ヵヶ]/.test(s)){
   const clean=hiraToKata(s).replace(/(です|でした|です。|だと思います)$/,'');
   if(plantSet.has(clean))return clean;
   // 認識の軽微な違いを近似検索（文字数が近い候補だけ）
   let best=null,bestScore=1;
   for(const n of plantDatabase){if(Math.abs(n.length-clean.length)>3)continue; const d=levenshtein(clean,n); const score=d/Math.max(clean.length,n.length); if(score<bestScore){bestScore=score;best=n}}
   if(best && bestScore<=0.22)return best;
   return hiraToKata(s);
 }
 return s;
}
function levenshtein(a,b){const dp=Array(b.length+1);for(let j=0;j<=b.length;j++)dp[j]=j;for(let i=1;i<=a.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=b.length;j++){const temp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=temp}}return dp[b.length]}
function getRecords(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}function setRecords(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a));renderRecords()}function nowISO(){return new Date().toISOString()}
function getLocation(){const el=document.getElementById("locationStatus");if(!navigator.geolocation){el.textContent="位置情報：このブラウザでは利用できません";return}el.textContent="位置情報：取得中…";navigator.geolocation.getCurrentPosition(pos=>{currentLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,horizontalAccuracy:pos.coords.accuracy};el.textContent=`位置情報：${currentLocation.latitude.toFixed(6)}, ${currentLocation.longitude.toFixed(6)}（±${Math.round(currentLocation.horizontalAccuracy)}m）`},()=>{currentLocation=null;el.textContent="位置情報：取得できませんでした（植物名と日時は保存できます）"},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById("message").textContent="このSafariでは音声認識を利用できません。";return}const r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=5;document.getElementById("message").textContent="聞き取っています…";r.onresult=e=>{const alts=Array.from(e.results[0]).map(x=>x.transcript);const raw=alts[0];let chosen=normalizePlantName(raw);for(const a of alts){const n=normalizePlantName(a);if(plantSet.has(n)){chosen=n;break}}document.getElementById("plantName").value=chosen;document.getElementById("message").textContent=`「${raw}」を認識しました。必要なら修正して「保存」を押してください。`;window.lastRawPlantName=raw;getLocation()};r.onerror=()=>{document.getElementById("message").textContent="音声認識でエラーが発生しました。もう一度お試しください。"};r.start()}
function save(){const input=document.getElementById("plantName");const name=normalizePlantName(input.value);if(!name){alert("植物名を入力してください。");return}input.value=name;const arr=getRecords();if(editingId){const i=arr.findIndex(x=>x.id===editingId);if(i>=0){arr[i].plantName=name;if(currentLocation)Object.assign(arr[i],currentLocation)}editingId=null}else{arr.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),plantName:name,recordedAt:nowISO(),latitude:currentLocation?.latitude??null,longitude:currentLocation?.longitude??null,horizontalAccuracy:currentLocation?.horizontalAccuracy??null});if(window.lastRawPlantName&&window.lastRawPlantName!==name){const aliases=JSON.parse(localStorage.getItem("plant_aliases_v1")||"{}");aliases[window.lastRawPlantName]=name;localStorage.setItem("plant_aliases_v1",JSON.stringify(aliases))}}const previousCount=arr.length;setRecords(arr);input.value="";window.lastRawPlantName="";document.getElementById("message").textContent=previousCount%100===0?`保存しました。${previousCount}件です。CSV保存できます。`:"保存しました。";getLocation()}
function editRecord(id){const x=getRecords().find(r=>r.id===id);if(!x)return;editingId=id;document.getElementById("plantName").value=x.plantName;document.getElementById("message").textContent="修正内容を入力して「保存」を押してください。";window.scrollTo({top:0,behavior:"smooth"})}
function deleteRecord(id){if(confirm("この記録を削除しますか？"))setRecords(getRecords().filter(x=>x.id!==id))}
function fmtDate(s){const d=new Date(s);return d.toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function renderRecords(){const el=document.getElementById("records"),arr=getRecords();const countEl=document.getElementById("countStatus");if(countEl)countEl.textContent=`記録件数：${arr.length}件（100件区切り）`;if(!arr.length){el.innerHTML='<div class="status">まだ記録がありません。</div>';return}el.innerHTML=arr.map(x=>{const loc=x.latitude!=null?`📍 ${Number(x.latitude).toFixed(6)}, ${Number(x.longitude).toFixed(6)}（±${Math.round(x.horizontalAccuracy||0)}m）`:"📍 位置情報なし";return `<div class="record"><div class="name">${escapeHtml(x.plantName)}</div><div class="meta">${fmtDate(x.recordedAt)}<br>${loc}</div><button onclick="editRecord('${x.id}')">編集</button><button class="delete" onclick="deleteRecord('${x.id}')">削除</button></div>`}).join("")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#39;"}[m]))}
function exportCSV(){const all=getRecords();if(!all.length){alert("まだ記録がありません。");return}const rows=all.map((x,i)=>[i+1,new Date(x.recordedAt).toLocaleDateString("ja-JP"),new Date(x.recordedAt).toLocaleTimeString("ja-JP"),x.plantName,x.latitude??"",x.longitude??"",x.horizontalAccuracy??""]);const csv="\uFEFF"+[["No.","Date","Time","Plant name","Latitude","Longitude","GPS accuracy"],...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`植物記録_${all.length}件_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
document.getElementById("speakBtn").onclick=recognize;document.getElementById("saveBtn").onclick=save;document.getElementById("csvBtn").onclick=exportCSV;renderRecords();getLocation();
</script></body></html>
